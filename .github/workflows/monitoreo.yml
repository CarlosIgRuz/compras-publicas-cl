name: Monitoreo del modelo
# Cada día (después de la descarga nocturna): reconstruye el warehouse, puntúa las licitaciones
# recién publicadas con el modelo desplegado y regenera el reporte de monitoreo.
# No consulta la API de ChileCompra, así que puede correr a cualquier hora.
on:
  schedule:
    - cron: "37 13 * * *"   # ~10:37 Chile (los cron de GitHub pueden llegar con horas de atraso)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitoreo
  cancel-in-progress: false

jobs:
  monitoreo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install duckdb dbt-duckdb pandas numpy scikit-learn lightgbm fastapi
      - name: Construir el warehouse
        run: dbt build --project-dir dbt --profiles-dir dbt
      - name: Puntuar licitaciones recién publicadas
        env: { PYTHONPATH: src }
        run: python -m compras.monitor.puntuar
      - name: Reporte de monitoreo
        env: { PYTHONPATH: src }
        run: python -m compras.monitor.reporte
      - name: Guardar predicciones y reporte
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predicciones reports/monitoreo.md reports/monitoreo.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "data: monitoreo $(date -u +%F) [Fuente: Dirección ChileCompra]"
          git pull --rebase
          git push
