name: Ingesta diaria
# Corre cada noche (03:15 Chile ≈ 06:15 UTC) dentro del horario recomendado por ChileCompra (22:00–07:00).
on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      desde: { description: "Fecha inicio (YYYY-MM-DD), vacío = ayer", required: false }
      hasta: { description: "Fecha fin (YYYY-MM-DD), vacío = igual a desde", required: false }

permissions:
  contents: write

concurrency: ingesta

jobs:
  ingesta:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests python-dotenv
      - name: Descargar licitaciones
        env:
          MERCADO_PUBLICO_TICKET: ${{ secrets.MERCADO_PUBLICO_TICKET }}
          PYTHONPATH: src
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
        run: |
          ARGS=""
          [ -n "$DESDE" ] && ARGS="$ARGS --desde $DESDE"
          [ -n "$HASTA" ] && ARGS="$ARGS --hasta $HASTA"
          python -m compras.ingest.extract $ARGS
      - name: Guardar datos en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git diff --cached --quiet && exit 0
          git commit -m "data: ingesta $(date -u +%F) [Fuente: Dirección ChileCompra]"
          git pull --rebase
          git push
